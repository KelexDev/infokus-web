<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOKUS | Agencia de Diseño Gráfico y Redes Sociales</title>
    <meta name="description"
        content="Elevamos tu marca con diseño estratégico y gestión profesional de redes sociales.">
    <!-- Tailwind CSS Play CDN para desarrollo ágil y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/assets/css/styles.css">
</head>

<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navegación -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="text-2xl font-black tracking-wider uppercase text-indigo-400">INFO<span
                    class="text-white">KUS</span></a>
            <nav class="hidden md:flex gap-8 text-sm font-medium text-slate-300">
                <a href="#servicios" class="hover:text-indigo-400 transition-colors">Servicios</a>
                <a href="#portafolio" class="hover:text-indigo-400 transition-colors">Portafolio</a>
                <a href="#nosotros" class="hover:text-indigo-400 transition-colors">Nosotros</a>
            </nav>
            <a href="#contacto"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-all shadow-lg shadow-indigo-600/20">
                Contáctanos
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="py-24 md:py-32 max-w-7xl mx-auto px-6 text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight max-w-4xl mx-auto leading-tight">
                Potenciamos tu marca con <span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-violet-400">estrategia
                    visual y digital</span>
            </h1>
            <p class="mt-6 text-lg md:text-xl text-slate-400 max-w-2xl mx-auto">
                Diseño gráfico de alto impacto y gestión profesional de redes sociales diseñados para convertir
                seguidores en clientes fieles.
            </p>
            <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
                <a href="#portafolio"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-xl font-medium transition-all">
                    Ver Portafolio
                </a>
                <a href="#contacto"
                    class="bg-slate-900 hover:bg-slate-850 border border-slate-800 text-slate-300 px-8 py-4 rounded-xl font-medium transition-all">
                    Hablemos de tu proyecto
                </a>
            </div>
        </section>
    </main>

    <!-- Script Principal -->
    <script src="./src/js/main.js"></script>
</body>

</html>
